version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  api:
    build: .
    command: uvicorn extractor.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      BASE_DIR: /app
    depends_on:
      - rabbitmq
    volumes:
      - ./src:/app/src
      - ./templates:/app/templates
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads

  worker:
    build: .
    command: python -m extractor.worker.consumer
    env_file: .env
    environment:
      BASE_DIR: /app
    depends_on:
      - rabbitmq
    volumes:
      - ./src:/app/src
      - ./templates:/app/templates
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
