[project]
name = "extract-data"
version = "0.2.0"
description = "Extract data from images using OpenRouter VLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "aio-pika>=9.3.0",
    "aiofiles>=23.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-aio-pika>=0.48b0",
    "opentelemetry-instrumentation-requests>=0.48b0",
]

[project.scripts]
extract-data = "extractor.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "httpx>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
files = ["src"]
# Application (not a library): silence third-party packages that ship no type
# stubs (PyMuPDF/fitz, aiofiles, aio_pika, opentelemetry) instead of vendoring
# stub packages. Our own code is still type-checked.
ignore_missing_imports = true
